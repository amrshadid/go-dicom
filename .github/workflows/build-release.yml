name: Build and Release Binaries

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runs-on: ubuntu-latest
            output: dicom-linux-amd64
          - os: linux
            arch: arm64
            runs-on: ubuntu-latest
            output: dicom-linux-arm64
          - os: darwin
            arch: amd64
            runs-on: macos-latest
            output: dicom-macos-amd64
          - os: darwin
            arch: arm64
            runs-on: macos-latest
            output: dicom-macos-arm64
          - os: windows
            arch: amd64
            runs-on: windows-latest
            output: dicom-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: go build -ldflags "-X main.Version=$(git describe --tags)" -o ${{ matrix.output }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}

  create-release:
    name: Create Release with Binaries
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: ./binaries

      - name: Prepare artifacts
        run: |
          mkdir -p release
          find binaries -type f -exec cp {} release/ \;
          ls -la release/

      - name: Get version
        id: version
        run: echo "tag=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT

      - name: Extract changelog notes
        id: changelog
        run: |
          VERSION=$(git describe --tags --abbrev=0)
          NOTES=$(sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$d' || echo "")
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](https://github.com/amrshadid/go-dicom/blob/main/CHANGELOG.md) for details."
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create checksums
        working-directory: release
        run: |
          for file in *; do
            if [ -f "$file" ]; then
              sha256sum "$file" >> SHA256SUMS
            fi
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Release ${{ steps.version.outputs.tag }}"
          body: |
            # go-dicom ${{ steps.version.outputs.tag }}

            ${{ steps.changelog.outputs.notes }}

            ## Download Binaries

            | Platform | Download |
            |----------|----------|
            | Linux (x86_64) | `dicom-linux-amd64` |
            | Linux (ARM64) | `dicom-linux-arm64` |
            | macOS (Intel) | `dicom-macos-amd64` |
            | macOS (Apple Silicon) | `dicom-macos-arm64` |
            | Windows (x86_64) | `dicom-windows-amd64.exe` |

            ## Installation

            ### Using Go
            ```bash
            go install github.com/amrshadid/go-dicom@${{ steps.version.outputs.tag }}
            ```

            ### Download Binary
            Download the appropriate binary for your platform above and add it to your PATH.

            ## Verification

            Verify the integrity of downloaded binaries using the SHA256SUMS file:

            ```bash
            sha256sum -c SHA256SUMS
            ```

            See [CHANGELOG.md](https://github.com/amrshadid/go-dicom/blob/main/CHANGELOG.md) for complete release notes.
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
