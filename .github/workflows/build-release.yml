name: Build and Release Binaries


on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runs-on: ubuntu-latest
            output: dicom-linux-amd64
          - os: linux
            arch: arm64
            runs-on: ubuntu-latest
            output: dicom-linux-arm64
          - os: darwin
            arch: amd64
            runs-on: macos-latest
            output: dicom-macos-amd64
          - os: darwin
            arch: arm64
            runs-on: macos-latest
            output: dicom-macos-arm64
          - os: windows
            arch: amd64
            runs-on: windows-latest
            output: dicom-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Download dependencies
        run: go mod download

      # github.ref_name is exactly the tag that triggered this run. Using it
      # instead of `git describe` avoids depending on tag history being present
      # in the default shallow checkout, and cannot produce a "-N-gHASH" suffix.
      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: go build -ldflags "-X main.Version=${{ github.ref_name }}" -o ${{ matrix.output }} .

      - name: Verify the version was stamped
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: |
          stamped=$(./${{ matrix.output }} -v)
          echo "$stamped"
          case "$stamped" in
            *"${{ github.ref_name }}"*) ;;
            *) echo "::error::binary reports '$stamped', expected it to contain '${{ github.ref_name }}'"; exit 1 ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}

  create-release:
    name: Create Release with Binaries
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./binaries

      - name: Prepare artifacts
        run: |
          mkdir -p release
          find binaries -type f -exec cp {} release/ \;
          ls -la release/

      - name: Get version
        id: version
        run: echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT

      # CHANGELOG.md headings are unprefixed ("## [1.2.0]") while tags carry a
      # leading v ("v1.2.0"), so the tag name must be stripped before matching.
      # Without this every release silently fell back to the generic message.
      - name: Extract changelog notes
        id: changelog
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          # Drop the section's own "## [1.2.3] - date" heading. GitHub already
          # shows the version as the release title and the date as the release
          # timestamp, so repeating both reads as boilerplate.
          # The range always begins with the section heading, so '1d' removes it;
          # '/./,$!d' then drops the blank lines it left at the top.
          NOTES=$(sed -n "/^## \[$VERSION\]/,/^## \[/p" CHANGELOG.md | sed '$d' | sed '1d' | sed '/./,$!d')
          if [ -z "$NOTES" ]; then
            echo "::warning::no CHANGELOG.md section found for [$VERSION]; using the generic fallback"
            NOTES="See [CHANGELOG.md](https://github.com/amrshadid/go-dicom/blob/main/CHANGELOG.md) for details."
          fi
          echo "notes<<CHANGELOG_EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "CHANGELOG_EOF" >> $GITHUB_OUTPUT

      - name: Create checksums
        working-directory: release
        run: |
          for file in *; do
            if [ -f "$file" ]; then
              sha256sum "$file" >> SHA256SUMS
            fi
          done

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            ${{ steps.changelog.outputs.notes }}

            ---

            ## Install

            ```bash
            go install github.com/amrshadid/go-dicom@${{ steps.version.outputs.tag }}
            ```

            Or download a binary below and place it on your `PATH`:

            | Platform | File |
            |----------|------|
            | Linux x86-64 | `dicom-linux-amd64` |
            | Linux ARM64 | `dicom-linux-arm64` |
            | macOS Intel | `dicom-macos-amd64` |
            | macOS Apple Silicon | `dicom-macos-arm64` |
            | Windows x86-64 | `dicom-windows-amd64.exe` |

            Checksums are in `SHA256SUMS`:

            ```bash
            sha256sum -c SHA256SUMS
            ```

            [Full changelog](https://github.com/amrshadid/go-dicom/blob/main/CHANGELOG.md)
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
