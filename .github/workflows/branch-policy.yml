name: Branch Policy


# Enforces that main only ever receives work that has already been through
# develop.
#
# This cannot be expressed as a branch protection rule or a ruleset: GitHub can
# require a pull request, require reviews, and require status checks, but it has
# no setting for which branch a pull request may come *from*. The only place to
# enforce it is a check that the protection rule then requires.
#
# It also runs on pull requests into develop, where it always passes. That
# looks redundant but is not: a check run is attached to a commit SHA, not to a
# pull request. Retargeting a rejected pull request from main to develop — the
# exact thing this check tells people to do — otherwise leaves the failed run
# attached to the commit with nothing to supersede it, so following the
# instructions correctly still shows a red X. Running on both bases means the
# retarget re-reports the same check name as a pass.
on:
  pull_request:
    branches: [ main, develop ]
    types: [ opened, reopened, synchronize, edited ]

permissions:
  contents: read

jobs:
  source-branch:
    name: PR source branch
    runs-on: ubuntu-latest
    steps:
      - name: Require main to be merged from develop
        env:
          # Read through the environment rather than interpolating directly
          # into the script: a branch name is attacker-controlled on a fork,
          # and ${{ }} would paste it into the shell before bash sees it.
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$BASE_REF" != "main" ]; then
            echo "Base branch is '$BASE_REF', not main. Any source branch is allowed."
            exit 0
          fi

          if [ "$HEAD_REF" = "develop" ] && [ "$HEAD_REPO" = "$BASE_REPO" ]; then
            echo "Source branch is develop. Allowed."
            exit 0
          fi

          echo "::error::Pull requests into main must come from develop (this one is from '$HEAD_REF' on '$HEAD_REPO')."
          cat <<'MSG'

          main is release-only: it takes changes exclusively from develop, so
          that everything reaching a tagged release has already been reviewed
          and has passed CI once on develop.

          Retarget this pull request at develop. On the GitHub page for the PR,
          use "Edit" next to the title and change the base branch; the commits
          and review history are kept.

          Once it is merged into develop, a single develop -> main pull request
          promotes it along with anything else queued for release.
          MSG
          exit 1
