name: Tests and Quality Checks

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test - Go ${{ matrix.go-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.24']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests with coverage
        run: go test -v -race -timeout 5m -coverprofile coverage.out -covermode atomic ./...

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.24'
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-umbrella

  network-integration:
    name: Network Integration Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.24']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Run network unit tests
        run: go test -v -race -timeout 5m ./network/...

      - name: Run network integration tests (real TCP SCP+SCU)
        run: go test -v -race -timeout 5m -run TestIntegration ./network/...

  lint:
    name: Lint - golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          args: --timeout=5m

  build:
    name: Build CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Download dependencies
        run: go mod download

      - name: Build CLI
        run: go build -o dicom .

      - name: Verify CLI help
        run: ./dicom -h

      - name: Verify CLI version
        run: ./dicom -v

      - name: Verify network CLI commands are registered
        run: |
          ./dicom -h | grep -q echoscu
          ./dicom -h | grep -q storescu
          ./dicom -h | grep -q storescp
          ./dicom -h | grep -q findscu
          ./dicom -h | grep -q movescu

  module-check:
    name: Module Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Verify module
        run: go mod verify

      - name: List dependencies
        run: go list -m all

      - name: Check for security vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || echo "::warning::govulncheck found vulnerabilities (may be stdlib-only, review output above)"

  docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check README exists
        run: test -f README.md

      - name: Check LICENSE exists
        run: test -f LICENSE

      - name: Check CHANGELOG exists
        run: test -f CHANGELOG.md

      - name: Verify module documentation
        run: |
          for dir in anonymize charset cli compress config dataelem dataset element encaps errors filebase filereader fileset fileutil filewriter hooks jsonrep multival network overlays pixels sequence sr tag uid util valuerep values waveforms; do
            if [ -d "$dir" ]; then
              test -f "$dir/doc.go" || (echo "Missing doc.go in $dir"; exit 1)
            fi
          done
